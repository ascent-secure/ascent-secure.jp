<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';">
  <title>アセントセキュア株式会社</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #0a0e1a;
      color: #ffffff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 40px; }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: 0.1em; color: #ffffff; }
    .logo span { color: #4a9eff; }
    .tagline { margin-top: 16px; font-size: 14px; color: #8899aa; letter-spacing: 0.2em; }
    .divider { width: 40px; height: 2px; background: #4a9eff; margin: 32px auto; }
    .message { font-size: 15px; color: #aabbcc; line-height: 1.8; }
    .coming { margin-top: 40px; font-size: 11px; letter-spacing: 0.3em; color: #556677; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Ascent<span>Secure</span></div>
    <div class="tagline">アセントセキュア株式会社</div>
    <div class="divider"></div>
    <div class="message">
      企業インフラを守る、専門的なセキュリティサービスを提供します。<br>
      サイトは準備中です。
    </div>
    <div class="coming">COMING SOON · 2026</div>
  </div>
</body>
</html>
