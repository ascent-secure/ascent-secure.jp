<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  
  <title>アセントセキュア株式会社</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #0a0e1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { 
      text-align: center; 
      padding: 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: 0.1em; color: #ffffff; }
    .logo span { color: #4a9eff; }
    .tagline { margin-top: 16px; font-size: 14px; color: #8899aa; letter-spacing: 0.2em; }
    .divider { width: 40px; height: 2px; background: #4a9eff; margin: 32px auto; }
    .message { font-size: 15px; color: #aabbcc; line-height: 1.8; }
    .coming { margin-top: 40px; font-size: 11px; letter-spacing: 0.3em; color: #556677; }
    
    /* ナビゲーション */
    nav {
      padding: 20px 40px;
      text-align: center;
      border-bottom: 1px solid #1a2030;
    }
    nav a {
      color: #8899aa;
      text-decoration: none;
      margin: 0 20px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
      padding: 8px 16px;
      border-radius: 4px;
      display: inline-block;
    }
    nav a:hover {
      color: #0a0e1a;
      background: #ffffff;
    }
    
    /* フッター */
    footer {
      padding: 20px;
      text-align: center;
      font-size: 11px;
      color: #556677;
      border-top: 1px solid #1a2030;
    }
    
    @media (max-width: 768px) {
      nav a { margin: 0 10px; font-size: 12px; padding: 6px 12px; }
      .container { padding: 20px; }
      .logo { font-size: 24px; }
      .tagline { font-size: 12px; }
      .message { font-size: 14px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">HOME</a>
    <a href="services.html">Services</a>
    <a href="company.html">Company</a>
  </nav>

  <div class="container">
    <div class="logo">Ascent<span>Secure</span></div>
    <div class="tagline">アセントセキュア株式会社</div>
    <div class="divider"></div>
    <div class="message">
      企業インフラを守る、専門的なセキュリティサービスを提供します。<br>
      サイトは準備中です。
    </div>
    <div class="coming">COMING SOON · SEPTEMBER 2025</div>
  </div>
  
  <footer>
    &copy; 2026 AscentSecure Co., Ltd. All Rights Reserved.
  </footer>
</body>
</html>
