<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- セキュリティヘッダー（最大強化） -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), ambient-light-sensor=()">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;">
  <meta name="robots" content="noindex, nofollow">
  
  <title>アセントセキュア株式会社</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #0a0e1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { 
      text-align: center; 
      padding: 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: 0.1em; color: #ffffff; }
    .logo span { color: #4a9eff; }
    .tagline { margin-top: 16px; font-size: 14px; color: #8899aa; letter-spacing: 0.2em; }
    .divider { width: 40px; height: 2px; background: #4a9eff; margin: 32px auto; }
    .message { font-size: 15px; color: #aabbcc; line-height: 1.8; }
    .coming { margin-top: 40px; font-size: 11px; letter-spacing: 0.3em; color: #556677; }
    
    /* ナビゲーション */
    nav {
      padding: 20px 40px;
      text-align: center;
      border-bottom: 1px solid #1a2030;
    }
    nav a {
      color: #8899aa;
      text-decoration: none;
      margin: 0 20px;
      font-size: 13px;
      letter-spacing: 0.1em;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #4a9eff;
    }
    
    /* フッター */
    footer {
      padding: 20px;
      text-align: center;
      font-size: 11px;
      color: #556677;
      border-top: 1px solid #1a2030;
    }
    
    @media (max-width: 768px) {
      nav a { margin: 0 10px; font-size: 12px; }
      .container { padding: 20px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">HOME</a>
    <a href="services.html">サービス</a>
