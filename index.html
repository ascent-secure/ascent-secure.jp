<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="アセントセキュア株式会社は、企業インフラを守る専門のセキュリティエンジニアリング企業です。SIEM構築、脆弱性管理、セキュリティ基盤の構築・運用、教育・研修まで対応します。">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <title>アセントセキュア株式会社</title>

  <style>
    @font-face {
      font-family: 'Poppins';
      src: url('/poppins-700.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #0a0e1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    nav {
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1a2030;
      position: relative;
      z-index: 4;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-mark { height: 34px; width: auto; display: block; }
    .brand-text {
      font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
      font-size: 18px; font-weight: 700;
      letter-spacing: 0.08em; color: #ffffff;
    }
    .nav-links a {
      color: #64748b; text-decoration: none; margin-left: 20px;
      font-size: 13px; letter-spacing: 0.1em;
      transition: color 0.3s ease;
      padding: 8px 14px; display: inline-block;
    }
    .nav-links a:hover { color: #cbd5e1; }

    /* ヒーロー */
    .hero {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 80px 30px;
    }

    /* 上：星空（地平線へ向かってフェード） */
    .sky {
      position: absolute; top: 0; left: 0; right: 0;
      height: 72%; z-index: 1; overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 56%, transparent 100%);
              mask-image: linear-gradient(to bottom, #000 0%, #000 56%, transparent 100%);
    }
    .field {
      position: absolute; top: 0; left: 0;
      width: 3840px; height: 100%;
      animation: drift-stars 320s linear infinite;
    }
    @keyframes drift-stars {
      from { transform: translateX(0); }
      to   { transform: translateX(-1920px); }
    }
    .field i {
      position: absolute; border-radius: 50%;
      animation-name: twinkle;
      animation-duration: var(--d);
      animation-delay: var(--y);
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    @keyframes twinkle {
      from { opacity: var(--lo); }
      to   { opacity: var(--hi); }
    }
    .field .t1 { width:1.6px; height:1.6px; background:#8fa0b8; box-shadow:0 0 2.9px #8fa0b8; }
    .field .t2 { width:2.4px; height:2.4px; background:#b3c2d6; box-shadow:0 0 5.3px #b3c2d6; }
    .field .t3 { width:3.4px; height:3.4px; background:#d2dcea; box-shadow:0 0 8.8px #d2dcea; }
    .field .t4 { width:5.6px; height:5.6px; background:#eef3fa; box-shadow:0 0 16.0px #eef3fa; }

    /* 下：波（等高線） */
    .waves {
      position: absolute; left: 0; bottom: 0;
      width: 100%; height: 46%; z-index: 2; overflow: hidden;
    }
    .waves svg {
      position: absolute; bottom: 0; left: 0;
      width: 200%; height: 100%;
      animation: drift-waves 90s linear infinite;
    }
    @keyframes drift-waves {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .hero-inner { position: relative; z-index: 3; text-align: center; }
    .hero-mark { height: 108px; width: auto; margin-bottom: 30px; }
    .logo {
      font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
      font-size: 28px; font-weight: 700;
      letter-spacing: 0.16em; color: #f2f5f8;
    }
    .tagline {
      margin-top: 16px; font-size: 12px;
      color: #64748b; letter-spacing: 0.22em;
    }
    .divider { width: 36px; height: 1px; background: #3a4556; margin: 30px auto; }
    .message {
      font-size: 14px; color: #94a3b8;
      line-height: 2.05; letter-spacing: 0.02em;
    }
    .sp-br { display: none; }

    /* スマホ専用の背景（PCでは非表示） */
    .sp-fog, .sp-lines { display: none; }

    /* フッター */
    footer {
      padding: 22px; text-align: center;
      font-size: 11px; color: #556677;
      border-top: 1px solid #1a2030;
      position: relative; z-index: 4;
    }

    @media (max-width: 768px) {
      nav { padding: 14px 18px; flex-direction: column; gap: 14px; }
      .brand { gap: 9px; }
      .brand-mark { height: 26px; }
      .brand-text { font-size: 15px; letter-spacing: 0.06em; }
      .nav-links { display: flex; justify-content: center; }
      .nav-links a {
        margin: 0; font-size: 11.5px;
        padding: 6px 12px; letter-spacing: 0.08em;
      }

      /* PC用の星空と波はスマホでは非表示 */
      .sky, .waves { display: none; }

      /* スマホ専用：霧のグラデーション＋最下部の等高線 */
      .sp-fog {
        display: block;
        position: absolute; inset: 0; z-index: 1;
        background: linear-gradient(to top,
          rgba(45,62,90,0.32) 0%,
          rgba(28,38,56,0.14) 40%,
          transparent 74%);
      }
      .sp-lines {
        display: block;
        position: absolute; inset: 0; z-index: 1;
        width: 100%; height: 100%;
      }

      .hero { padding: 64px 24px 72px; }
      .hero-mark { height: 76px; margin-bottom: 26px; }
      .logo { font-size: 21px; letter-spacing: 0.11em; }
      .tagline { font-size: 10.5px; letter-spacing: 0.18em; margin-top: 14px; }
      .divider { margin: 26px auto; }
      .message { font-size: 12.5px; line-height: 2.1; }
      .sp-br { display: inline; }
    }

    @media (max-width: 360px) {
      .hero-mark { height: 66px; }
      .logo { font-size: 19px; letter-spacing: 0.08em; }
      .message { font-size: 11.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .field, .field i, .waves svg { animation: none !important; }
    }
  </style>
</head>
